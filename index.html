<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>간트 차트</title>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>프로젝트 일정</h1>
        <div class="header-actions">
          <button type="button" id="export-btn" class="btn-ghost" title="모든 태스크를 JSON 파일로 저장">내보내기</button>
          <button type="button" id="import-btn" class="btn-ghost" title="내보낸 JSON 파일에서 태스크 불러오기">불러오기</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden />
          <button type="button" id="reset-btn" class="btn-ghost">새 프로젝트</button>
        </div>
      </header>

      <main class="board">
        <div class="panel-toolbar list-toolbar">
          <span id="task-count" class="task-count"></span>
          <button type="button" id="add-btn" class="btn-primary">+ 태스크 추가</button>
        </div>
        <div class="panel-toolbar chart-toolbar">
          <div class="view-modes" role="group" aria-label="보기 단위">
            <button type="button" data-mode="Day" class="active">일</button>
            <button type="button" data-mode="Week">주</button>
            <button type="button" data-mode="Month">월</button>
          </div>
          <button type="button" id="today-btn" class="btn-ghost">오늘</button>
        </div>

        <div class="board-body">
          <section class="task-list" aria-label="태스크 목록">
            <div class="list-head">
              <span>태스크</span>
              <span>시작일</span>
              <span>종료일</span>
              <span>진행률</span>
              <span class="sr-only">관리</span>
            </div>
            <ul id="task-rows"></ul>
          </section>
          <section class="chart" aria-label="간트 차트">
            <div id="gantt"></div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="task-modal" class="modal">
      <form id="task-form" method="dialog" novalidate>
        <h2 id="modal-title">태스크 추가</h2>

        <label class="field">
          <span>이름</span>
          <input name="name" type="text" required maxlength="60" autocomplete="off" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>시작일</span>
            <input name="start" type="date" required />
          </label>
          <label class="field">
            <span>종료일</span>
            <input name="end" type="date" required />
          </label>
        </div>

        <label class="field">
          <span>진행률 (%)</span>
          <input name="progress" type="number" min="0" max="100" step="1" inputmode="numeric" required />
        </label>

        <fieldset class="field">
          <legend>선행 태스크</legend>
          <div id="dependency-options" class="dependency-options"></div>
        </fieldset>

        <p id="form-error" class="form-error" role="alert"></p>

        <div class="modal-actions">
          <button type="button" id="delete-btn" class="btn-danger">삭제</button>
          <span class="spacer"></span>
          <button type="button" id="cancel-btn" class="btn-ghost">취소</button>
          <button type="submit" class="btn-primary">저장</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-modal" class="modal modal-sm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button type="submit" value="cancel" class="btn-ghost">취소</button>
          <button type="submit" value="ok" id="confirm-ok" class="btn-danger-solid"></button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
