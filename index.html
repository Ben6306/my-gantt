<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gantt</title>
    <meta name="description" content="Plan tasks on a gantt chart. Data stays in this browser." />
    <meta name="theme-color" content="#0f0f10" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>
          <svg class="logo-mark" viewBox="0 0 20 20" aria-hidden="true">
            <rect x="2" y="3" width="10" height="4" rx="2" class="c-purple" />
            <rect x="6" y="8" width="12" height="4" rx="2" class="c-blue" />
            <rect x="4" y="13" width="8" height="4" rx="2" class="c-green" />
          </svg>
          <input
            id="project-name"
            class="project-name"
            type="text"
            maxlength="60"
            autocomplete="off"
            spellcheck="false"
            aria-label="Project name"
            title="Click to rename"
          />
          <button
            type="button"
            id="project-menu-btn"
            class="icon-btn"
            popovertarget="project-menu"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-label="Switch project"
            title="Switch project"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
        </h1>
        <div id="project-menu" class="project-menu" popover>
          <p class="project-menu-label">Projects</p>
          <ul id="project-list" class="project-list"></ul>
          <div class="project-menu-actions">
            <button type="button" id="menu-new-project-btn" class="menu-action">New project</button>
            <button type="button" id="delete-project-btn" class="menu-action danger">Delete this project</button>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" id="backup-status" class="backup-status">
            <span class="backup-dot" aria-hidden="true"></span>
            <span id="backup-status-text"></span>
          </button>
          <button type="button" id="png-btn" class="btn-ghost" title="Save the whole schedule as an image, at the current zoom">Export PNG</button>
          <button type="button" id="export-btn" class="btn-ghost" title="Save all tasks to a JSON backup file">Export JSON</button>
          <button type="button" id="import-btn" class="btn-ghost" title="Load tasks from a JSON backup file">Import JSON</button>
          <input type="file" id="import-file" accept=".json,application/json" hidden />
          <button
            type="button"
            id="more-btn"
            class="btn-ghost"
            popovertarget="more-menu"
            aria-haspopup="menu"
            aria-expanded="false"
            title="Baseline, spreadsheet, sharing and backup"
          >
            More
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div id="more-menu" class="project-menu more-menu" popover>
            <p class="project-menu-label">Baseline</p>
            <button type="button" id="baseline-set-btn" class="menu-action">Save current dates as baseline</button>
            <button type="button" id="baseline-clear-btn" class="menu-action">Clear baseline</button>
            <p class="project-menu-label">Share</p>
            <button type="button" id="share-link-btn" class="menu-action">Copy view-only link</button>
            <p class="project-menu-label">Spreadsheet</p>
            <button type="button" id="csv-export-btn" class="menu-action">Export CSV (Excel, Google Sheets)</button>
            <button type="button" id="csv-import-btn" class="menu-action">Import CSV as a new project…</button>
            <input type="file" id="csv-file" accept=".csv,text/csv" hidden />
            <p class="project-menu-label">Backup</p>
            <button type="button" id="export-all-btn" class="menu-action">Export all projects (JSON)</button>
            <button type="button" id="autosave-btn" class="menu-action">Auto-save to a file…</button>
            <button type="button" id="autosave-stop-btn" class="menu-action">Stop auto-saving</button>
          </div>
          <button type="button" id="new-project-btn" class="btn-ghost" title="Start a new empty project (your other projects stay)">New project</button>
        </div>
      </header>

      <div id="share-banner" class="share-banner" hidden>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>
        <span id="share-banner-text"></span>
        <span class="spacer"></span>
        <button type="button" id="share-save-btn" class="btn-primary btn-sm-primary">Save to my projects</button>
        <button type="button" id="share-close-btn" class="btn-ghost btn-sm">Close</button>
      </div>

      <main class="board">
        <div class="panel-toolbar list-toolbar">
          <span id="task-count" class="task-count"></span>
          <div class="toolbar-actions">
            <button type="button" id="undo-btn" class="icon-btn" aria-label="Undo" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
            </button>
            <button type="button" id="redo-btn" class="icon-btn" aria-label="Redo" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" /></svg>
            </button>
            <button type="button" id="add-btn" class="btn-primary">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg>
              Add task
            </button>
          </div>
        </div>
        <div class="panel-toolbar chart-toolbar">
          <div class="zoom" role="group" aria-label="Zoom">
            <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /><path d="M8 11h6" /></svg>
            </button>
            <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /><path d="M11 8v6" /><path d="M8 11h6" /></svg>
            </button>
            <button type="button" id="fit-btn" title="Fit the whole schedule on screen">Fit</button>
          </div>
          <div class="view-modes" role="group" aria-label="Time scale">
            <button type="button" data-mode="Day" class="active">Day</button>
            <button type="button" data-mode="Week">Week</button>
            <button type="button" data-mode="Month">Month</button>
          </div>
          <button type="button" id="today-btn" class="btn-ghost">Today</button>
        </div>

        <div
          id="list-resizer"
          class="list-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize task list (double-click to fit names)"
          title="Drag to resize · double-click to fit names"
          tabindex="0"
        ></div>

        <div class="board-body">
          <section class="task-list" aria-label="Tasks">
            <div class="list-head">
              <div class="list-tools">
                <label class="search">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.35-4.35" /></svg>
                  <input id="search-input" type="search" placeholder="Search names and notes" autocomplete="off" spellcheck="false" aria-label="Search tasks" />
                </label>
                <button type="button" id="filter-btn" class="btn-ghost btn-sm" popovertarget="filter-menu" aria-haspopup="true" aria-expanded="false">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z" /></svg>
                  <span id="filter-label">Filter</span>
                </button>
                <div id="filter-menu" class="project-menu filter-menu" popover>
                  <label class="menu-check"><input type="checkbox" id="filter-done" /> Hide completed</label>
                  <label class="menu-check"><input type="checkbox" id="filter-late" /> Only late (overdue or behind)</label>
                  <p class="project-menu-label">Colors</p>
                  <div id="filter-colors" class="color-options filter-colors"></div>
                  <div class="project-menu-actions">
                    <button type="button" id="filter-clear" class="menu-action">Clear search and filters</button>
                  </div>
                </div>
              </div>
              <span class="list-head-task">
                Task
                <button
                  type="button"
                  id="fit-names-btn"
                  class="icon-btn icon-btn-sm"
                  aria-label="Fit column to task names"
                  title="Fit column to task names (or drag / double-click the divider)"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 8 4 4-4 4" /><path d="M2 12h20" /><path d="m6 8-4 4 4 4" /></svg>
                </button>
              </span>
              <span>Start</span>
              <span>End</span>
              <span>Progress</span>
              <span class="sr-only">Actions</span>
            </div>
            <ul id="task-rows"></ul>
          </section>
          <section class="chart" aria-label="Gantt chart">
            <div id="gantt"></div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="task-modal" class="modal modal-wide">
      <form id="task-form" method="dialog" novalidate>
        <h2 id="modal-title">Add task</h2>

        <fieldset class="field">
          <legend class="sr-only">Type</legend>
          <div class="segmented" id="type-options">
            <label><input type="radio" name="type" value="task" /><span>Task</span></label>
            <label><input type="radio" name="type" value="milestone" /><span>Milestone</span></label>
            <label><input type="radio" name="type" value="group" /><span>Group</span></label>
          </div>
        </fieldset>

        <label class="field">
          <span>Name</span>
          <textarea name="name" class="name-input" rows="1" required maxlength="200" autocomplete="off" spellcheck="false"></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span id="start-label">Start date</span>
            <input name="start" type="date" required />
          </label>
          <label class="field not-milestone">
            <span>End date</span>
            <input name="end" type="date" required />
          </label>
        </div>
        <p id="duration-hint" class="field-hint" aria-live="polite"></p>

        <div class="field-row">
          <label class="field not-group">
            <span>In group</span>
            <select name="parent" id="parent-select"></select>
          </label>
          <label class="field not-milestone">
            <span>Progress (%)</span>
            <input name="progress" type="number" min="0" max="100" step="1" inputmode="numeric" required />
          </label>
          <label class="field field-check-cell only-milestone">
            <span>Status</span>
            <span class="field-check">
              <input name="done" type="checkbox" />
              <span>Done</span>
            </span>
          </label>
        </div>

        <fieldset class="field">
          <legend>Color</legend>
          <div id="color-options" class="color-options"></div>
        </fieldset>

        <div class="field-row">
          <fieldset class="field not-group">
            <legend>Depends on</legend>
            <div id="dependency-options" class="dependency-options"></div>
          </fieldset>
          <label class="field">
            <span>Notes</span>
            <textarea name="notes" rows="5" maxlength="2000" placeholder="Details, links, who’s on it…"></textarea>
          </label>
        </div>

        <p id="form-error" class="form-error" role="alert"></p>

        <div class="modal-actions">
          <button type="button" id="delete-btn" class="btn-danger">Delete</button>
          <span class="spacer"></span>
          <button type="button" id="cancel-btn" class="btn-ghost">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-modal" class="modal modal-sm">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button type="submit" value="cancel" class="btn-ghost">Cancel</button>
          <button type="submit" value="ok" id="confirm-ok" class="btn-danger-solid"></button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
